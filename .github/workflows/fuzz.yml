---
# Go fuzz testing.
#
# DISABLED BY DEFAULT — only workflow_dispatch is active.
# To enable scheduled runs, uncomment the schedule trigger below.
#
# Adjust FUZZ_TIME to control how long each fuzz target runs.

name: Fuzz

on:
  workflow_dispatch:
  # Uncomment to run on schedule:
  # schedule:
  #   - cron: '0 3 * * 6'  # weekly on Saturday at 03:00 UTC

permissions:
  contents: read

env:
  FUZZ_TIME: 60s

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Find and run fuzz targets
        run: |
          set -euo pipefail
          TARGETS=$(grep -r --include='*_test.go' -l 'func Fuzz' . || true)
          if [ -z "$TARGETS" ]; then
            echo "No fuzz targets found, skipping."
            exit 0
          fi
          FAILED=0
          for file in $TARGETS; do
            DIR=$(dirname "$file")
            FUNCS=$(grep -oP 'func \K(Fuzz\w+)' "$file")
            for FUNC in $FUNCS; do
              echo "::group::Fuzzing $FUNC in $DIR"
              if ! go test "$DIR" -fuzz="^${FUNC}$" -fuzztime="$FUZZ_TIME" -race; then
                echo "::error::Fuzz target $FUNC in $DIR failed"
                FAILED=1
              fi
              echo "::endgroup::"
            done
          done
          exit $FAILED
