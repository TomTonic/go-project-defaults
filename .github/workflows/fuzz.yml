---
# Go fuzz testing.
#
# DISABLED BY DEFAULT — only workflow_dispatch is active.
# To enable scheduled runs, uncomment the schedule trigger below.
#
# Adjust FUZZ_TIME to control how long each fuzz target runs.

name: Fuzz

on:
  workflow_dispatch:
  # Uncomment to run on schedule:
  # schedule:
  #   - cron: '0 3 * * 6'  # weekly on Saturday at 03:00 UTC

permissions:
  contents: read

env:
  FUZZ_TIME: 60s

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Find and run fuzz targets
        run: |
          set -euo pipefail
          TARGETS=$(grep -r --include='*_test.go' -l 'func Fuzz' . || true)
          if [ -z "$TARGETS" ]; then
            echo "No fuzz targets found, skipping."
            exit 0
          fi
          FAILED=0
          for file in $TARGETS; do
            DIR=$(dirname "$file")
            FUNCS=$(grep -oP 'func \K(Fuzz\w+)' "$file")
            for FUNC in $FUNCS; do
              echo "::group::Fuzzing $FUNC in $DIR"
              if ! go test "$DIR" -fuzz="^${FUNC}$" -fuzztime="$FUZZ_TIME" -race; then
                echo "::error::Fuzz target $FUNC in $DIR failed"
                FAILED=1
              fi
              echo "::endgroup::"
            done
          done
          exit $FAILED
