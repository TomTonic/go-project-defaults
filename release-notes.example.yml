# Copy to .claude/release-notes.yml in your project and customize.
# All keys are optional — omit any that don't apply.

# A list, not a single entry — some projects have several equally "defining"
# dependencies (e.g. a Docker image built from an upstream project plus a
# couple of plugins, none of which alone is *the* core dependency).
# core_dependencies:
#   - module: github.com/example/some-core-lib
#     name: some-core-lib
#   - module: github.com/example/some-plugin
#     name: some-plugin
#     # Only needed when the version isn't derivable from go.mod/go.sum —
#     # e.g. a Docker-image build wrapper pinning it as a tag in a config
#     # file instead of importing it.
#     pinned_in: build-versions.json#.some_plugin_tag

# Only needed if this repo's tags deviate from standard semver/chronological
# tags (e.g. date-based tags, a monorepo with per-package prefixes).
# tag_scheme: ""

# Only for cases govulncheck/grype can't resolve mechanically on their own
# (non-Go components, cgo, business-logic reasons) — reachability that
# govulncheck can already determine is re-checked fresh every release and
# doesn't belong here.
# known_not_applicable:
#   - id: CVE-YYYY-NNNNN
#     reason: we only import the unaffected subpackage

# Where to actually find each direct dependency's release notes (its repo
# root is often not it). Caches the *location* only — content is still
# re-read fresh every release.
# changelog_sources:
#   - module: github.com/example/some-lib
#     url: https://github.com/example/some-lib/releases
